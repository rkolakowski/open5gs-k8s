apiVersion: v1
kind: ConfigMap
metadata:
  name: pcf-configmap
  labels:
    app: open5gs
data:
  pcfcfg.yaml: |
    db_uri: mongodb://mongodb/open5gs

    logger:
      file: /open5gs/install/var/log/open5gs/pcf.log

    global:
      max:
        ue: 1024

    pcf:
      sbi:
        server:
          - dev: eth0
            advertise: pcf-npcf.open5gs.svc.clusterset.local
            port: 80
        client:
          scp:
            - uri: http://scp-nscp.open5gs.svc.clusterset.local:80
      metrics:
        server:
          - address: 0.0.0.0
            port: 9090

apiVersion: v1
kind: ConfigMap
metadata:
  name: bsf-configmap
  labels:
    app: open5gs
data:
  bsfcfg.yaml: |
    logger:
      file: /open5gs/install/var/log/open5gs/bsf.log

    global:
      max:
        ue: 1024

    bsf:
      sbi:
        server:
          - dev: eth0
            advertise: bsf-nbsf.open5gs.svc.clusterset.local
            port: 80
        client:
          scp:
            - uri: http://scp-nscp.open5gs.svc.clusterset.local:80
#            - uri: http://scp-nscp:80

